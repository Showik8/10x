<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Password Checker</title>
      
</head>
<body>
    <div id="cont" class="container">
        <div id="timer"></div>
        <h1>Password Checker</h1>
        <input required type="password" id="passwordInput" placeholder="Enter password">
        <button onclick="submitPassword()">Submit</button>
        <div id="message" class="message"></div>
        <div id="attemptsLeft" class="attempts">You have 3 attempts left.</div>
    </div>
    <div id="reminder">
        <h2>You have less then minute of life,Before we start You need to know how to write down <b> Password Numbers</b> and <b>Simbols</b></h2>
        <span>(hint: Pass word XI Warning )</span>
    </div>
<button id="btn" onclick="tryPlaySound()">Are You Ready?</button>

    <script src="./index.js"></script>
    <script src="./timer.js"></script>
  </body>
</html>
